# OPCIONAL: gera snapshots/faol.json (horários da FAOL já interpretados) e o publica no repositório.
# O app só usa esse arquivo se FAOL_SNAPSHOT_URL (src/config.ts) estiver preenchida. Veja o README.
name: FAOL snapshot

on:
  workflow_dispatch:
  # Para atualizar sozinho todo dia às 08:00 UTC (05:00 em Brasília), descomente:
  # schedule:
  #   - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: faol-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Gerar snapshot
        run: npm run snapshot:faol

      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/faol.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "chore: atualiza snapshot da FAOL"
            git push
          fi
